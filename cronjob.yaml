apiVersion: batch/v1
kind: CronJob
metadata:
  name: time-cronjob
spec:
  schedule: "*/1 * * * *"   # co minutê
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
          - name: time
            image: busybox
            command:
              - sh
              - -c
              - |
                echo "CronJob fired at:"
                date
