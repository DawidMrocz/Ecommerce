apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartapi-deployment
  labels:
    app: cartapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cartapi
  template:
    metadata:
      labels:
        app: cartapi
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      terminationGracePeriodSeconds: 30
      containers:
        - name: cartapi
          image: dawid064/cartapi:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: app-secrets
            - configMapRef:
                name: app-config
          # resources:
          #   requests:
          #     cpu: "100m"
          #     memory: "128Mi"
          #   limits:
          #     cpu: "500m"
          #     memory: "256Mi"
          # livenessProbe:
          #   httpGet:
          #     path: /health
          #     port: 3000
          #   initialDelaySeconds: 10
          #   periodSeconds: 10
          # readinessProbe:
          #   httpGet:
          #     path: /health
          #     port: 3000
          #   initialDelaySeconds: 5
          #   periodSeconds: 5
          # securityContext:
          #   runAsNonRoot: true
          #   allowPrivilegeEscalation: false

---
apiVersion: v1
kind: Service
metadata:
  name: cartapi-service
spec:
  type: ClusterIP   
  selector:
    app: cartapi
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 8080